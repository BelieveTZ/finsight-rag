[project]
name = "finsight-rag"
version = "0.1.0"
description = "Evidence-grounded financial report QA experiments."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed>=0.7,<0.8",
    "pypdf>=6,<7",
    "pypdfium2>=5,<6",
    "pillow>=11,<13",
    "rank-bm25==0.2.2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
